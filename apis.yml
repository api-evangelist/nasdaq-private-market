aid: nasdaq-private-market
name: Nasdaq Private Market
description: 'Nasdaq Private Market (NPM) operates infrastructure for the secondary
  market in pre-IPO private company equity — tender offers, company buybacks, auctions,
  block trades and a settlement engine for private share transfers — alongside a Data
  & Intelligence business built on NPM Price, a daily price estimate for 400+ liquid
  private companies, and Tape D, a private-company pricing dataset combining primary
  round data, secondary market transactions, mutual fund marks and 409A valuations.
  Securities are offered through NPM Securities, LLC (member FINRA/SIPC); SecondMarket
  Financial, LLC is an SEC-registered investment adviser and wholly owned subsidiary.
  Programmatic access to Tape D is sold on the Premium tier and distributed exclusively
  through Nasdaq Data Link; NPM itself publishes no developer portal, API reference,
  or machine-readable specification.'
