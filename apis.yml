apis:
- aid: nasdaq-private-market:tape-d
  name: Nasdaq Private Market Tape D API
  description: 'Tape D is NPM''s private-company pricing and valuation dataset — real-time
    private market pricing integrating primary round data, secondary market transactions,
    mutual fund marks and 409A valuations across 4,000+ venture-backed companies. Nasdaq,
    Inc. is the exclusive distributor of the Tape D API; access is sold on NPM''s Premium
    (Talk to Sales) tier and delivered through Nasdaq Data Link''s REST API alongside
    SFTP/S3 bulk delivery. No OpenAPI, dataset/table code, or public API reference for
    Tape D is published — the "Learn about API Access" call to action on NPM''s own
    Data & Intelligence page resolves to an empty "#" anchor.'
  humanURL: https://www.nasdaqprivatemarket.com/data-intelligence/
